<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AllergyPal</title>
  <link rel="stylesheet" type="text/css" href="css/shared.css">
  <link rel="stylesheet" type="text/css" href="css/profile.css">
</head>

<script src="js/main.js" defer></script>

<body>
  <div id="navbar"></div>

  <main>
    <div class="profile-container">
      <div class="profile-main">
        <h1>My Profile</h1>
        <img src="images/cookie.png" alt="Profile picture" class="profile-icon">
      </div>
      <div class="profile-allergens-container">
        <div class="saved-allergens">
          <h1>Saved Allergens</h1>
          <div class="button-row">
            <button class="allergen-config">(+) Add Allergen</button>
            <button class="allergen-config">(-) Remove Allergen</button>
          </div>
        </div>
        <ul class="allergens-display">
          <li>Peanuts</li>
          <li>Tree Nuts (e.g., almonds, walnuts, cashews)</li>
          <li>Milk</li>
          <li>Eggs</li>
          <li>Fish</li>
          <li>Shellfish (e.g., shrimp, crab, lobster)</li>
          <li>Wheat</li>
          <li>Soy</li>
          <li>Sesame</li>
          <li>Mustard</li>
          <li>Sulfites</li>
        </ul>
      </div>
  </main>
  <div id="footer"></div>
</body>

</html>
