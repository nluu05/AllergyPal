<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chocolate Chip Cookie – AllergyPal</title>
    <link rel="icon" href="images/peanut.png" />
    <link rel="stylesheet" type="text/css" href="css/shared.css" />
    <link rel="stylesheet" type="text/css" href="css/usermain.css" />
    <link rel="stylesheet" type="text/css" href="css/product.css" />
  </head>

  <body>
    <div id="navbar"></div>

    <main class="font">

      <div class="product-wrapper">
    
        <!-- LEFT: Image + Title -->
        <div class="product-left-section">
          <img src="images/rye-bread.webp" alt="Rye Bread" class="product-image-large" />
    
          <h1 class="product-title-img">Rye Bread</h1>
        </div>
    
        <!-- RIGHT: Info -->
        <div class="product-info-box">
    
          <div class="info-section">
            <h2>Ingredients</h2>
            <p class="info-line">Rye Flour</p>
            <p class="info-line">Water</p>
            <p class="info-line">Yeast</p>
            <p class="info-line">Salt</p>
            <p class="info-line">Sugar</p>
            <p class="info-line">Wheat Flour</p>
          </div>
    
          <div class="info-section">
            <h2>Allergen Information</h2>
            <p>This product contains the following allergens:</p>
            <p class="info-line"> Wheat (Gluten) </p>
            <p class="info-line"> Rye (Gluten) </p>
            <p class="info-line"> Barley (Gluten) </p>
          </div>
    
          <p class="product-note">
            Please check the packaging for any additional allergen warnings or
            cross-contact information.
          </p>
    
        </div>
    
      </div>
    
      <div class="divider"></div>
    
    </main>       
    
    <div id="footer"></div>
    <script src="js/main.js" defer></script>
  </body>
</html>
